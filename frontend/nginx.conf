server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        # The official nginx image substitutes FAASD_GATEWAY on startup.
        # /api/luas-persegi becomes /function/luas-persegi on the gateway.
        proxy_pass ${FAASD_GATEWAY}/function/;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
